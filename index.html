        // Move down (toward start of array)
        for (let i = 1; i < state.shapes.length; i++) {
          if (selectedSet.has(state.shapes[i].id) && !selectedSet.has(state.shapes[i - 1].id)) {
            const tmp = state.shapes[i];
            state.shapes[i] = state.shapes[i - 1];
            state.shapes[i - 1] = tmp;
          }
        }
      }
      renderAll();
      triggerAutoSave();
    }

    function copySelectedShape() {
      const selected = getSelectedShapes();
      if (selected.length === 0) return;
      state.clipboardShapes = selected.map(sh => ({
        ...JSON.parse(JSON.stringify(sh)),
        refRows: state.gridRows
      }));
      syncUIWithSelectedShape();
      showToast(`${selected.length}個の図形をコピーしました`);
    }

    function pasteClipboardShape() {
      if (state.clipboardShapes.length === 0) return;
      saveHistory();

      const newIds = [];
      const fineStep = getMinFineStepY(state.gridRows);
      for (const src of state.clipboardShapes) {
        const scale = state.gridRows / (src.refRows || state.gridRows);
        const canShiftRight = src.nodes.every(n => n.right < GRID_COLS);
        const shiftX = canShiftRight ? 1 : 0;

        const newNodes = src.nodes.map((n, idx) => {
          const w = n.right - n.left;
          const left = snapInt(n.left + shiftX, 0, GRID_COLS - w);
          const y = snapFine1920(n.y * scale, idx * fineStep, state.gridRows - (src.nodes.length - 1 - idx) * fineStep);
          return {
            left,
            right: left + w,
            y,
            curveMode: n.curveMode || 'straight'
          };
        });

        const newShape = normalizeShape({
          id: 'shape_' + Date.now() + '_' + Math.floor(Math.random() * 10000),
          color: src.color,
          nodes: newNodes
        });

        state.shapes.push(newShape);
        newIds.push(newShape.id);
      }

      state.selectedShapeIds = newIds;
      state.activeShapeId = newIds[newIds.length - 1] || null;
      state.activeNodeIndex = 0;
      setMode('draw');
      syncUIWithSelectedShape();
      renderAll();
      triggerAutoSave();
      showToast('図形をペーストしました');
    }

    function saveSelectedShapeAsTemplate() {
      const shape = getActiveShape();
      if (!shape) return;
      const inputEl = document.getElementById('inpTemplateName');
      const rawName = inputEl.value.trim();
      const colorName = (COLORS[shape.color] || COLORS.green).name;
      const firstMode = shape.nodes[0]?.curveMode || 'straight';
      const curveLabel = firstMode === 'left' ? '（（' : (firstMode === 'right' ? '））' : '直線');
      const name = rawName || `${colorName}・${curveLabel}`;

      const tpl = {
        id: 'tpl_' + Date.now(),
        name,
        color: shape.color,
        nodesRatio: shape.nodes.map(n => ({
          left: n.left,
          right: n.right,
          yRatio: n.y / state.gridRows,
          curveMode: n.curveMode || 'straight'
        }))
      };

      state.templates.unshift(tpl);
      inputEl.value = '';
      renderTemplateList();
      saveTemplatesToStorage();
      triggerAutoSave();
      showToast(`テンプレート「${name}」を保存しました`);
    }

    function applyTemplate(tpl) {
      saveHistory();
      const rows = state.gridRows;
      const fineStep = getMinFineStepY(rows);
      let nodes = [];

      if (Array.isArray(tpl.nodesRatio) && tpl.nodesRatio.length >= 2) {
        const len = tpl.nodesRatio.length;
        nodes = tpl.nodesRatio.map((nr, i) => ({
          left: nr.left,
          right: nr.right,
          y: snapFine1920((nr.yRatio ?? (i / (len - 1))) * rows, i * fineStep, rows - (len - 1 - i) * fineStep, rows),
          curveMode: nr.curveMode || 'straight'
        }));
      } else {
        const startY = snapFine1920((tpl.startYRatio || 0) * rows, 0, rows - fineStep, rows);
        const endY = snapFine1920((tpl.endYRatio || 0.85) * rows, startY + fineStep, rows, rows);
        nodes = [
          { left: tpl.startLeft ?? 2, right: tpl.startRight ?? 6, y: startY, curveMode: tpl.curveMode || 'straight' },
          { left: tpl.endLeft ?? 4, right: tpl.endRight ?? 7, y: endY, curveMode: 'straight' }
        ];
      }

      const newShape = normalizeShape({
        id: 'shape_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
        color: tpl.color || state.currentColor,
        nodes
      });

      state.shapes.push(newShape);
      selectSingleShape(newShape.id, 0);
      state.currentColor = newShape.color;
      state.currentCurveMode = newShape.nodes[0].curveMode;
      updateColorButtonsUI();
      setMode('draw');
      syncUIWithSelectedShape();
      renderAll();
      triggerAutoSave();
      showToast(`テンプレート「${tpl.name}」を配置しました`);
    }

    function deleteTemplate(tplId) {
      state.templates = state.templates.filter(t => t.id !== tplId);
      renderTemplateList();
      saveTemplatesToStorage();
      triggerAutoSave();
    }

    function renderTemplateList() {
      const container = document.getElementById('templateListContainer');
      document.getElementById('lblTemplateCount').textContent = `${state.templates.length}件`;
      container.innerHTML = '';

      if (state.templates.length === 0) {
        container.innerHTML = `<div class="text-[11px] text-slate-500 py-2 text-center">図形を選択して「＋ 保存」で登録</div>`;
        return;
      }

      state.templates.forEach(tpl => {
        const cObj = COLORS[tpl.color] || COLORS.green;
        const row = document.createElement('div');
        row.className = 'flex items-center justify-between gap-1.5 px-2 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800/90 border border-slate-800 text-xs transition';
        row.innerHTML = `
          <button class="flex-1 flex items-center gap-2 text-left truncate text-slate-200 hover:text-white" data-act="insert">
            <span class="w-3 h-3 rounded-sm shrink-0 inline-block" style="background:${cObj.hex}"></span>
            <span class="truncate font-medium">${tpl.name}</span>
          </button>
          <button class="text-[11px] px-1.5 py-0.5 rounded bg-sky-500/20 text-sky-300 hover:bg-sky-500/30 shrink-0" data-act="insert">追加</button>
          <button class="text-[11px] px-1.5 py-0.5 rounded text-slate-400 hover:text-rose-300 shrink-0" data-act="del" title="削除">✕</button>
        `;
        row.querySelectorAll('[data-act="insert"]').forEach(btn => {
          btn.addEventListener('click', () => applyTemplate(tpl));
        });
        row.querySelector('[data-act="del"]').addEventListener('click', () => deleteTemplate(tpl.id));
        container.appendChild(row);
      });
    }

    function saveTemplatesToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY_TEMPLATES, JSON.stringify(state.templates));
      } catch (err) {
        console.warn('Template storage error:', err);
      }
    }

    function saveFullPaletteWithName() {
      const inputEl = document.getElementById('inpPaletteSaveName');
      const rawName = inputEl.value.trim();
      const defaultName = `パレット ${state.savedPalettes.length + 1} (12×${state.gridRows})`;
      const name = rawName || defaultName;

      const entry = {
        id: 'pal_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
        name,
        savedAt: new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }),
        gridRows: state.gridRows,
        slideOpacity: state.slideOpacity,
        guideOpacity: state.guideOpacity,
        grid: JSON.parse(JSON.stringify(state.grid)),
        shapes: JSON.parse(JSON.stringify(state.shapes))
      };

      state.savedPalettes.unshift(entry);
      inputEl.value = '';
      renderSavedPaletteList();
      savePalettesToStorage();
      triggerAutoSave();
      showToast(`パレット全体「${name}」を保存しました`);
    }

    function loadSavedFullPalette(entry) {
      if (!entry) return;
      saveHistory();
      applyLoadedData({
        gridRows: entry.gridRows,
        slideOpacity: entry.slideOpacity,
        guideOpacity: entry.guideOpacity,
        grid: JSON.parse(JSON.stringify(entry.grid || [])),
        shapes: JSON.parse(JSON.stringify(entry.shapes || []))
      });
      triggerAutoSave();
      showToast(`パレット「${entry.name}」を読み込みました`);
    }

    function deleteSavedFullPalette(id) {
      state.savedPalettes = state.savedPalettes.filter(p => p.id !== id);
      renderSavedPaletteList();
      savePalettesToStorage();
      triggerAutoSave();
    }

    function renderSavedPaletteList() {
      const container = document.getElementById('savedPaletteListContainer');
      const countEl = document.getElementById('lblSavedPaletteCount');
      if (!container || !countEl) return;
      countEl.textContent = `${state.savedPalettes.length}件`;
      container.innerHTML = '';

      if (state.savedPalettes.length === 0) {
        container.innerHTML = `<div class="text-[11px] text-slate-500 py-2 text-center">名前を付けて「＋ 全体保存」で登録</div>`;
        return;
      }

      state.savedPalettes.forEach(item => {
        const shapeCount = Array.isArray(item.shapes) ? item.shapes.length : 0;
        const row = document.createElement('div');
        row.className = 'flex items-center justify-between gap-1.5 px-2 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800/90 border border-slate-800 text-xs transition';
        row.innerHTML = `
          <button class="flex-1 flex items-center gap-1.5 text-left truncate text-slate-200 hover:text-white" data-act="load">
            <span class="truncate font-medium">${item.name}</span>
            <span class="text-[10px] font-mono text-slate-400 shrink-0">(12×${item.gridRows}・${shapeCount}個)</span>
          </button>
          <button class="text-[11px] px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 hover:bg-emerald-500/30 shrink-0" data-act="load">読込</button>
          <button class="text-[11px] px-1.5 py-0.5 rounded text-slate-400 hover:text-rose-300 shrink-0" data-act="del" title="削除">✕</button>
        `;
        row.querySelectorAll('[data-act="load"]').forEach(btn => {
          btn.addEventListener('click', () => loadSavedFullPalette(item));
        });
        row.querySelector('[data-act="del"]').addEventListener('click', () => deleteSavedFullPalette(item.id));
        container.appendChild(row);
      });
    }

    function savePalettesToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY_SAVED_PALETTES, JSON.stringify(state.savedPalettes));
      } catch (err) {
        console.warn('Saved palettes storage error:', err);
      }
    }

    function buildExportPayload() {
      return {
        version: 4,
        savedAt: new Date().toISOString(),
        gridRows: state.gridRows,
        lastUsedWidth: state.lastUsedWidth,
        slideOpacity: state.slideOpacity,
        guideOpacity: state.guideOpacity,
        grid: state.grid,
        shapes: state.shapes,
        templates: state.templates,
        savedPalettes: state.savedPalettes
      };
    }

    let autoSaveTimer = null;
    function triggerAutoSave() {
      if (autoSaveTimer) clearTimeout(autoSaveTimer);
      autoSaveTimer = setTimeout(() => {
        performAutoSave();
      }, 250);
    }

    async function performAutoSave() {
      const payload = buildExportPayload();
      const jsonStr = JSON.stringify(payload, null, 2);

      try {
        localStorage.setItem(STORAGE_KEY_PALETTE, jsonStr);
      } catch (e) {
        console.warn('LocalStorage save failed:', e);
      }

      if (state.directoryHandle) {
        try {
          const paletteFileHandle = await state.directoryHandle.getFileHandle('palette_autosave.json', { create: true });
          const writable = await paletteFileHandle.createWritable();
          await writable.write(jsonStr);
          await writable.close();

          const tplFileHandle = await state.directoryHandle.getFileHandle('shape_templates.json', { create: true });
          const tplWritable = await tplFileHandle.createWritable();
          await tplWritable.write(JSON.stringify(state.templates, null, 2));
          await tplWritable.close();

          const savedPalFileHandle = await state.directoryHandle.getFileHandle('saved_palettes.json', { create: true });
          const savedPalWritable = await savedPalFileHandle.createWritable();
          await savedPalWritable.write(JSON.stringify(state.savedPalettes, null, 2));
          await savedPalWritable.close();
        } catch (err) {
          console.warn('Folder write error:', err);
        }
      }
    }

    async function selectAutoSaveFolder() {
      if (!window.showDirectoryPicker) {
        downloadPaletteJson();
        showToast('フォルダ直接保存非対応のためJSON保存を実行しました');
        return;
      }
      try {
        const dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
        state.directoryHandle = dirHandle;
        const folderName = dirHandle.name || '選択フォルダ';
        document.getElementById('autoSaveBadge').textContent = `自動保存: 📁 ${folderName}`;
        document.getElementById('autoSaveBadge').className =
          'text-[11px] font-medium px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/40';
        await performAutoSave();
        showToast(`フォルダ「${folderName}」への自動保存を開始しました`);
      } catch (err) {
        if (err && err.name !== 'AbortError') {
          downloadPaletteJson();
          showToast('JSONファイルをダウンロードしました');
        }
      }
    }

    function downloadPaletteJson() {
      const payload = buildExportPayload();
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'palette_autosave.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    function getCanvasMousePos(canvas, evt) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: (evt.clientX - rect.left) * scaleX,
        y: (evt.clientY - rect.top) * scaleY
      };
    }

    function dist(x1, y1, x2, y2) {
      return Math.hypot(x2 - x1, y2 - y1);
    }

    function cycleNodeCurveMode(shape, nodeIdx) {
      if (!shape || !shape.nodes || nodeIdx < 0 || nodeIdx >= shape.nodes.length - 1) return;
      const order = ['straight', 'left', 'right'];
      const cur = shape.nodes[nodeIdx].curveMode || 'straight';
      const next = order[(order.indexOf(cur) + 1) % order.length];
      shape.nodes[nodeIdx].curveMode = next;
      state.currentCurveMode = next;
    }

    function eraseAtPoint(col, row) {
      const candidates = state.onlyMoveSelected
        ? state.shapes.filter(s => state.selectedShapeIds.includes(s.id))
        : state.shapes;

      for (let i = candidates.length - 1; i >= 0; i--) {
        const sh = candidates[i];
        if (isPointInsideShape(sh, col, row)) {
          state.shapes = state.shapes.filter(s => s.id !== sh.id);
          state.selectedShapeIds = state.selectedShapeIds.filter(id => id !== sh.id);
          if (state.activeShapeId === sh.id) {
            state.activeShapeId = state.selectedShapeIds[state.selectedShapeIds.length - 1] || null;
            state.activeNodeIndex = 0;
          }
          syncUIWithSelectedShape();
          return;
        }
      }

      const r = Math.floor(row);
      const c = Math.floor(col);
      if (r >= 0 && r < state.gridRows && c >= 0 && c < GRID_COLS) {
        if (state.grid[r] && state.grid[r][c]) {
          state.grid[r][c] = null;
        }
      }
    }

    const dragState = {
      active: false,
      type: null, // 'nodeLeft' | 'nodeRight' | 'nodeCenter' | 'newShape' | 'moveShapes' | 'erase'
      nodeIndex: 0,
      moved: false,
      wasAlreadySelected: false,
      dragOffsetCols: 0,
      startGridCol: 0,
      startGridRow: 0,
      initialSelectedSnapshots: []
    };

    function updateHoverState(pos, gridPt) {
      hoverState.inside = true;
      hoverState.px = pos.x;
      hoverState.py = pos.y;
      hoverState.col = gridPt.col;
      hoverState.row = gridPt.row;
      hoverState.type = null;
      hoverState.shapeId = null;
      hoverState.nodeIndex = -1;
      hoverState.segIndex = -1;
      hoverState.label = '';

      const lblHover = document.getElementById('lblHoverTarget');
      const activeShape = getActiveShape();

      // 1. Eraser mode hover preview
      if (state.mode === 'eraser') {
        const candidates = state.onlyMoveSelected
          ? state.shapes.map((s, i) => ({ s, i })).filter(item => state.selectedShapeIds.includes(item.s.id))
          : state.shapes.map((s, i) => ({ s, i }));
        for (let idx = candidates.length - 1; idx >= 0; idx--) {
          const { s, i } = candidates[idx];
          if (isPointInsideShape(s, gridPt.col, gridPt.row)) {
            hoverState.type = 'eraseShape';
            hoverState.shapeId = s.id;
            hoverState.label = `🗑 クリックで消去: ${getShapeDisplayName(s, i)}`;
            if (lblHover) lblHover.textContent = hoverState.label;
            return;
          }
        }
        if (lblHover) lblHover.textContent = '消しゴム: 図形に合わせてクリックで消去';
        return;
      }

      // 2. Relay Delete Mode hover preview
      if (state.relaySubMode === 'delete' && activeShape) {
        const nodes = activeShape.nodes;
        const hitRadius = 15;
        for (let k = 1; k < nodes.length - 1; k++) {
          const n = nodes[k];
          const pC = gridToPaletteXY((n.left + n.right) * 0.5, n.y);
          if (dist(pos.x, pos.y, pC.x, pC.y) <= hitRadius) {
            hoverState.type = 'relayDelete';
            hoverState.shapeId = activeShape.id;
            hoverState.nodeIndex = k;
            hoverState.label = `✕ 中継${k}を削除`;
            if (lblHover) lblHover.textContent = hoverState.label;
            return;
          }
        }
        if (lblHover) lblHover.textContent = '中継点削除モード: 削除する中継点(●)をクリック';
        return;
      }

      // 3. Relay Add Mode hover preview on selected shape
      if (state.relaySubMode === 'add' && activeShape) {
        const nodes = activeShape.nodes;
        const step1920 = getMinFineStepY();
        if (isPointInsideShape(activeShape, gridPt.col, gridPt.row)) {
          for (let k = 0; k < nodes.length - 1; k++) {
            const n0 = nodes[k];
            const n1 = nodes[k + 1];
            if (gridPt.row >= n0.y && gridPt.row <= n1.y && (n1.y - n0.y) >= step1920 * 2) {
              const insY = computeNodeSnappedY(gridPt.row, n0.y + step1920, n1.y - step1920, n0.y, n1.y);
              const tau = (insY - n0.y) / Math.max(step1920, n1.y - n0.y);
              const { leftCol, rightCol } = evaluateSegmentEdgesAtTau(n0, n1, tau);
              const insL = snapInt(leftCol, 0, GRID_COLS - 1);
              const insR = Math.max(insL + 1, snapInt(rightCol, 1, GRID_COLS));

              hoverState.type = 'relayAdd';
              hoverState.shapeId = activeShape.id;
              hoverState.segIndex = k;
              hoverState.insertY = insY;
              hoverState.insertLeft = insL;
              hoverState.insertRight = insR;
              hoverState.label = `＋ 中継点を配置 (Y:${formatYValue(insY)})`;
              if (lblHover) lblHover.textContent = hoverState.label;
              return;
            }
          }
        }
        if (lblHover) lblHover.textContent = '中継点追加モード: 選択図形の上をクリックして中継点を配置';
        return;
      }

      // 4. Active shape handle hover preview
      if (activeShape) {
        const hitRadius = 13;
        const nodes = activeShape.nodes;
        for (let k = 0; k < nodes.length; k++) {
          const n = nodes[k];
          const pL = gridToPaletteXY(n.left, n.y);
          const pR = gridToPaletteXY(n.right, n.y);
          const pC = gridToPaletteXY((n.left + n.right) * 0.5, n.y);
          const nodeTitle = k === 0 ? '始点' : (k === nodes.length - 1 ? '終点' : `中継${k}`);

          if (dist(pos.x, pos.y, pL.x, pL.y) <= hitRadius) {
            hoverState.type = 'handleLeft';
            hoverState.shapeId = activeShape.id;
            hoverState.nodeIndex = k;
            hoverState.label = `${nodeTitle}・左端の幅調整`;
            if (lblHover) lblHover.textContent = hoverState.label;
            return;
          }
          if (dist(pos.x, pos.y, pR.x, pR.y) <= hitRadius) {
            hoverState.type = 'handleRight';
            hoverState.shapeId = activeShape.id;
            hoverState.nodeIndex = k;
            hoverState.label = `${nodeTitle}・右端の幅調整`;
            if (lblHover) lblHover.textContent = hoverState.label;
            return;
          }
          if (dist(pos.x, pos.y, pC.x, pC.y) <= hitRadius + 3) {
            hoverState.type = 'handleCenter';
            hoverState.shapeId = activeShape.id;
            hoverState.nodeIndex = k;
            hoverState.label = k < nodes.length - 1
              ? `${nodeTitle}を移動 / クリックでカーブ切替`
              : `${nodeTitle}を移動`;
            if (lblHover) lblHover.textContent = hoverState.label;
            return;
          }
        }
      }

      // 5. Shape selection hover preview
      const searchList = state.onlyMoveSelected
        ? state.shapes.map((s, i) => ({ s, i })).filter(item => state.selectedShapeIds.includes(item.s.id))
        : state.shapes.map((s, i) => ({ s, i }));

      for (let idx = searchList.length - 1; idx >= 0; idx--) {
        const { s, i } = searchList[idx];
        if (isPointInsideShape(s, gridPt.col, gridPt.row)) {
          hoverState.type = 'shape';
          hoverState.shapeId = s.id;
          const isAlreadySel = state.selectedShapeIds.includes(s.id);
          hoverState.label = isAlreadySel
            ? `ドラッグで移動 / クリックで選択解除 (${getShapeDisplayName(s, i)})`
            : `クリックで選択: ${getShapeDisplayName(s, i)}`;
          if (lblHover) lblHover.textContent = hoverState.label;
          return;
        }
      }

      // 6. Empty space hover: if selected -> inform click will deselect; if unselected -> show new shape width preview
      if (state.selectedShapeIds.length > 0) {
        if (lblHover) lblHover.textContent = 'クリックで選択を解除';
      } else if (!state.onlyMoveSelected) {
        const w = Math.min(GRID_COLS, Math.max(1, state.lastUsedWidth));
        const startLeft = snapInt(Math.floor(gridPt.col) - Math.floor((w - 1) / 2), 0, GRID_COLS - w);
        const endY = snapInt(gridPt.row, 1, state.gridRows);
        hoverState.type = 'newShapePreview';
        hoverState.insertLeft = startLeft;
        hoverState.insertRight = startLeft + w;
        hoverState.insertY = endY;
        hoverState.label = `新規作成 (幅:${w}マス)`;
        if (lblHover) lblHover.textContent = `ドラッグで新規作成 (前回の幅: ${w}マス)`;
      }
    }

    paletteCanvas.addEventListener('pointerdown', (evt) => {
      evt.preventDefault();
      paletteCanvas.setPointerCapture(evt.pointerId);

      const pos = getCanvasMousePos(paletteCanvas, evt);
      const gridPt = paletteXYToGrid(pos.x, pos.y);
      const rows = state.gridRows;

      if (state.mode === 'eraser') {
        saveHistory();
        dragState.active = true;
        dragState.type = 'erase';
        eraseAtPoint(gridPt.col, gridPt.row);
        renderAll();
        triggerAutoSave();
        return;
      }

      const activeShape = getActiveShape();

      // 1. Relay Point Delete sub-mode: click a relay point on the selected shape to remove it
      if (state.relaySubMode === 'delete' && activeShape) {
        const hitRadius = 15;
        const nodes = activeShape.nodes;
        for (let k = 1; k < nodes.length - 1; k++) {
          const n = nodes[k];
          const pC = gridToPaletteXY((n.left + n.right) * 0.5, n.y);
          if (dist(pos.x, pos.y, pC.x, pC.y) <= hitRadius) {
            deleteRelayPointByIndex(activeShape, k);
            updateHoverState(pos, gridPt);
            renderAll();
            return;
          }
        }
        // Clicked outside any relay point while in delete mode -> exit relay sub-mode or deselect
        state.relaySubMode = null;
        selectSingleShape(null);
        updateHoverState(pos, gridPt);
        renderAll();
        showToast('選択を解除しました');
        return;
      }

      // 2. Relay Point Add sub-mode: click inside the selected shape to place a relay point
      if (state.relaySubMode === 'add' && activeShape) {
        if (isPointInsideShape(activeShape, gridPt.col, gridPt.row)) {
          if (insertRelayPointAtRow(activeShape, gridPt.row)) {
            updateHoverState(pos, gridPt);
            renderAll();
            return;
          }
        } else {
          // Clicked outside selected shape -> deselect and exit add mode
          state.relaySubMode = null;
          selectSingleShape(null);
          updateHoverState(pos, gridPt);
          renderAll();
          showToast('選択を解除しました');
          return;
        }
      }

      // 3. Check handles of the active shape
      if (activeShape) {
        const hitRadius = 13;
        const nodes = activeShape.nodes;

        for (let k = 0; k < nodes.length; k++) {
          const n = nodes[k];
          const pL = gridToPaletteXY(n.left, n.y);
          const pR = gridToPaletteXY(n.right, n.y);
          const pC = gridToPaletteXY((n.left + n.right) * 0.5, n.y);

          if (dist(pos.x, pos.y, pL.x, pL.y) <= hitRadius) {
            saveHistory();
            state.activeNodeIndex = k;
            dragState.active = true;
            dragState.type = 'nodeLeft';
            dragState.nodeIndex = k;
            syncUIWithSelectedShape();
            renderAll();
            return;
          }
          if (dist(pos.x, pos.y, pR.x, pR.y) <= hitRadius) {
            saveHistory();
            state.activeNodeIndex = k;
            dragState.active = true;
            dragState.type = 'nodeRight';
            dragState.nodeIndex = k;
            syncUIWithSelectedShape();
            renderAll();
            return;
          }
          if (dist(pos.x, pos.y, pC.x, pC.y) <= hitRadius + 3) {
            saveHistory();
            state.activeNodeIndex = k;
            dragState.active = true;
            dragState.moved = false;
            dragState.type = 'nodeCenter';
            dragState.nodeIndex = k;
            dragState.dragOffsetCols = Math.round(gridPt.col) - n.left;
            syncUIWithSelectedShape();
            renderAll();
            return;
          }
        }
      }

      // 4. Check if clicking inside a shape
      const searchList = state.onlyMoveSelected
        ? state.shapes.filter(s => state.selectedShapeIds.includes(s.id))
        : state.shapes;

      for (let i = searchList.length - 1; i >= 0; i--) {
        const sh = searchList[i];
        if (isPointInsideShape(sh, gridPt.col, gridPt.row)) {
          const alreadySelected = state.selectedShapeIds.includes(sh.id);
          if (!alreadySelected) {
            if (evt.shiftKey || evt.ctrlKey || evt.metaKey) {
              state.selectedShapeIds.push(sh.id);
              state.activeShapeId = sh.id;
            } else {
              selectSingleShape(sh.id, 0);
            }
          } else {
            state.activeShapeId = sh.id;
          }
          state.currentColor = sh.color;
          state.currentCurveMode = sh.nodes[0]?.curveMode || 'straight';
          updateColorButtonsUI();
          syncUIWithSelectedShape();

          // Start dragging all currently selected shapes together (if released without moving and wasAlreadySelected, it will deselect)
          saveHistory();
          dragState.active = true;
          dragState.type = 'moveShapes';
          dragState.moved = false;
          dragState.wasAlreadySelected = alreadySelected && !(evt.shiftKey || evt.ctrlKey || evt.metaKey);
          dragState.startGridCol = Math.round(gridPt.col);
          dragState.startGridRow = Math.round(gridPt.row);
          dragState.initialSelectedSnapshots = getSelectedShapes().map(s => ({
            id: s.id,
            nodes: JSON.parse(JSON.stringify(s.nodes))
          }));
          renderAll();
          return;
        }
      }

      // 5. If any shape is currently selected and user clicks empty space (no buttons/handles/shapes), DESELECT instead of drawing
      if (state.selectedShapeIds.length > 0) {
        selectSingleShape(null);
        updateHoverState(pos, gridPt);
        renderAll();
        showToast('選択を解除しました');
        return;
      }

      if (state.onlyMoveSelected) {
        showToast('「指定レイヤーのみ移動・編集」がONです');
        return;
      }

      // 6. Unselected state: create a new shape starting at bottom (Y=0) using lastUsedWidth for both start and end
      saveHistory();
      const w = Math.min(GRID_COLS, Math.max(1, state.lastUsedWidth));
      const startLeft = snapInt(Math.floor(gridPt.col) - Math.floor((w - 1) / 2), 0, GRID_COLS - w);
      const clickedRow = snapInt(gridPt.row, 1, rows);
      const newShape = normalizeShape({
        id: 'shape_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
        color: state.currentColor,
        nodes: [
          { left: startLeft, right: startLeft + w, y: 0, curveMode: state.currentCurveMode || 'straight' },
          { left: startLeft, right: startLeft + w, y: Math.max(1, clickedRow), curveMode: 'straight' }
        ]
      });
      state.shapes.push(newShape);
      selectSingleShape(newShape.id, 1);
      dragState.active = true;
      dragState.type = 'newShape';
      dragState.nodeIndex = 1;
      syncUIWithSelectedShape();
      renderAll();
    });

    paletteCanvas.addEventListener('pointermove', (evt) => {
      const pos = getCanvasMousePos(paletteCanvas, evt);
      const gridPt = paletteXYToGrid(pos.x, pos.y);
      const rows = state.gridRows;

      const dispX = Math.min(GRID_COLS, Math.max(1, Math.floor(gridPt.col) + 1));
      const dispY = Math.min(rows, Math.max(1, Math.floor(gridPt.row) + 1));
      document.getElementById('lblCursorCell').textContent = `X: ${dispX} , Y: ${dispY}`;

      if (!dragState.active) {
        updateHoverState(pos, gridPt);
        renderPalette();
        return;
      }

      if (dragState.type === 'erase') {
        eraseAtPoint(gridPt.col, gridPt.row);
        renderAll();
        return;
      }

      const snappedCol = snapInt(gridPt.col, 0, GRID_COLS);
      const snappedRow = snapInt(gridPt.row, 0, rows);

      if (dragState.type === 'moveShapes') {
        const dCol = snappedCol - dragState.startGridCol;
        const dRow = snappedRow - dragState.startGridRow;
        if (dCol !== 0 || dRow !== 0) {
          dragState.moved = true;
        }

        for (const snap of dragState.initialSelectedSnapshots) {
          const sh = state.shapes.find(s => s.id === snap.id);
          if (!sh) continue;

          let minLeft = GRID_COLS, maxRight = 0, minY = rows, maxY = 0;
          for (const n of snap.nodes) {
            minLeft = Math.min(minLeft, n.left);
            maxRight = Math.max(maxRight, n.right);
            minY = Math.min(minY, n.y);
            maxY = Math.max(maxY, n.y);
          }
          const clampedDCol = Math.max(-minLeft, Math.min(GRID_COLS - maxRight, dCol));
          const clampedDRow = Math.max(-minY, Math.min(rows - maxY, dRow));

          for (let k = 0; k < sh.nodes.length; k++) {
            sh.nodes[k].left = snap.nodes[k].left + clampedDCol;
            sh.nodes[k].right = snap.nodes[k].right + clampedDCol;
            sh.nodes[k].y = snapFine1920(snap.nodes[k].y + clampedDRow, 0, rows, rows);
          }
        }
        syncUIWithSelectedShape();
        renderAll();
        return;
      }

      const shape = getActiveShape();
      if (!shape) return;
      const nodes = shape.nodes;
      const k = dragState.nodeIndex;
      const node = nodes[k];
      if (!node) return;

      const step1920 = getMinFineStepY(rows);
      const prevY = k > 0 ? nodes[k - 1].y : null;
      const nextY = k < nodes.length - 1 ? nodes[k + 1].y : null;

      if (dragState.type === 'nodeLeft') {
        node.left = Math.min(node.right - 1, Math.max(0, snappedCol));
        setLastUsedWidth(node.right - node.left);
      } else if (dragState.type === 'nodeRight') {
        node.right = Math.max(node.left + 1, Math.min(GRID_COLS, snappedCol));
        setLastUsedWidth(node.right - node.left);
      } else if (dragState.type === 'nodeCenter') {
        const w = node.right - node.left;
        const newLeft = snapInt(snappedCol - dragState.dragOffsetCols, 0, GRID_COLS - w);
        const newY = computeNodeSnappedY(gridPt.row, 0, rows, prevY, nextY);
        if (newLeft !== node.left || Math.abs(newY - node.y) > 1e-5) {
          dragState.moved = true;
        }
        node.left = newLeft;
        node.right = newLeft + w;
        node.y = newY;
      } else if (dragState.type === 'newShape') {
        const endNode = nodes[nodes.length - 1];
        const w = endNode.right - endNode.left;
        const newLeft = snapInt(Math.floor(gridPt.col) - Math.floor((w - 1) / 2), 0, GRID_COLS - w);
        const newY = computeNodeSnappedY(gridPt.row, nodes[0].y + step1920, rows, nodes[0].y, null);
        endNode.left = newLeft;
        endNode.right = newLeft + w;
        endNode.y = Math.max(nodes[0].y + step1920, newY);
      }

      syncUIWithSelectedShape();
      renderAll();
    });

    paletteCanvas.addEventListener('pointerleave', () => {
      hoverState.inside = false;
      hoverState.type = null;
      const lblHover = document.getElementById('lblHoverTarget');
      if (lblHover) lblHover.textContent = 'カーソル位置 (左下起点):';
      if (!dragState.active) {
        renderPalette();
      }
    });

    function finishPointerDrag() {
      if (!dragState.active) return;

      if (dragState.type === 'nodeCenter' && !dragState.moved) {
        const shape = getActiveShape();
        if (shape && dragState.nodeIndex < shape.nodes.length - 1) {
          cycleNodeCurveMode(shape, dragState.nodeIndex);
          syncUIWithSelectedShape();
        }
      } else if (dragState.type === 'moveShapes' && !dragState.moved && dragState.wasAlreadySelected) {
        // Clicking on an already-selected shape (where there is no handle/button) without dragging deselects it
        state.history.pop();
        updateUndoButton();
        selectSingleShape(null);
        showToast('選択を解除しました');
      }

      dragState.active = false;
      dragState.type = null;
      renderAll();
      triggerAutoSave();
    }

    paletteCanvas.addEventListener('pointerup', finishPointerDrag);
    paletteCanvas.addEventListener('pointercancel', finishPointerDrag);

    function setMode(newMode) {
      state.mode = newMode;
      if (newMode === 'eraser') {
        state.relaySubMode = null;
      }
      document.querySelectorAll('.tool-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === newMode);
      });
      syncUIWithSelectedShape();
      showToast(newMode === 'eraser' ? '図形やマスをクリックして消去' : 'パレット上で作成・編集');
      renderAll();
    }

    document.querySelectorAll('.tool-btn').forEach(btn => {
      btn.addEventListener('click', () => setMode(btn.dataset.mode));
    });

    document.getElementById('btnGridMinus').addEventListener('click', () => stepGridDivision(-1));
    document.getElementById('btnGridPlus').addEventListener('click', () => stepGridDivision(1));

    function updateColorButtonsUI() {
      document.querySelectorAll('.color-swatch').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.color === state.currentColor);
      });
    }

    document.querySelectorAll('.color-swatch').forEach(btn => {
      btn.addEventListener('click', () => {
        state.currentColor = btn.dataset.color;
        updateColorButtonsUI();
        const selected = getSelectedShapes();
        if (selected.length > 0 && state.mode === 'draw') {
          saveHistory();
          selected.forEach(sh => { sh.color = state.currentColor; });
          syncUIWithSelectedShape();
          renderAll();
          triggerAutoSave();
        }
      });
    });

    // Opacity Sliders (Slide & Guide)
    document.getElementById('rngSlideOpacity').addEventListener('input', (e) => {
      const val = parseInt(e.target.value, 10);
      state.slideOpacity = val / 100;
      document.getElementById('lblSlideOpacity').textContent = `${val}%`;
      renderAll();
      triggerAutoSave();
    });

    document.getElementById('rngGuideOpacity').addEventListener('input', (e) => {
      const val = parseInt(e.target.value, 10);
      state.guideOpacity = val / 100;
      document.getElementById('lblGuideOpacity').textContent = `${val}%`;
      renderAll();
      triggerAutoSave();
    });

    // Curve Mode Selector Buttons: Straight, ((, ))
    document.querySelectorAll('.curve-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.currentCurveMode = btn.dataset.curve;
        const selected = getSelectedShapes();
        if (selected.length > 0) {
          saveHistory();
          if (selected.length === 1) {
            const sh = selected[0];
            const segIdx = Math.min(state.activeNodeIndex, sh.nodes.length - 2);
            sh.nodes[segIdx].curveMode = state.currentCurveMode;
          } else {
            // Apply to all segments of all selected shapes when multiple layers are selected
            selected.forEach(sh => {
              sh.nodes.forEach(n => { n.curveMode = state.currentCurveMode; });
            });
          }
          renderAll();
          triggerAutoSave();
        }
        syncUIWithSelectedShape();
      });
    });

    document.getElementById('btnAddRelayPoint').addEventListener('click', () => toggleRelaySubMode('add'));
    document.getElementById('btnDeleteRelayPoint').addEventListener('click', () => toggleRelaySubMode('delete'));

    // Collapsible Tabs Setup (5. Layer Management, 6. Shape Templates, 7. Full Palette Save)
    document.querySelectorAll('[data-collapse-target]').forEach(btn => {
      btn.addEventListener('click', () => {
        const targetId = btn.dataset.collapseTarget;
        const arrowId = btn.dataset.collapseArrow;
        const bodyEl = document.getElementById(targetId);
        const arrowEl = document.getElementById(arrowId);
        if (!bodyEl) return;
        const isHidden = bodyEl.classList.toggle('hidden');
        if (arrowEl) {
          arrowEl.style.transform = isHidden ? 'rotate(-90deg)' : 'rotate(0deg)';
        }
      });
    });

    // Layer Controls
    document.getElementById('btnLayerUp').addEventListener('click', () => moveSelectedLayers(1));
    document.getElementById('btnLayerDown').addEventListener('click', () => moveSelectedLayers(-1));

    document.getElementById('chkOnlyMoveSelected').addEventListener('change', (e) => {
      state.onlyMoveSelected = e.target.checked;
      showToast(state.onlyMoveSelected ? '指定レイヤーのみ移動・編集モードON' : '通常編集モード');
    });

    document.getElementById('btnSelectAllLayers').addEventListener('click', () => {
      state.selectedShapeIds = state.shapes.map(s => s.id);
      if (!state.activeShapeId && state.shapes.length > 0) {
        state.activeShapeId = state.shapes[state.shapes.length - 1].id;
      }
      syncUIWithSelectedShape();
      renderAll();
    });

    document.getElementById('btnDeselectAllLayers').addEventListener('click', () => {
      selectSingleShape(null);
      renderAll();
    });

    document.getElementById('btnCopyShape').addEventListener('click', copySelectedShape);
    document.getElementById('btnPasteShape').addEventListener('click', pasteClipboardShape);

    document.getElementById('btnDeleteShape').addEventListener('click', () => {
      if (state.selectedShapeIds.length === 0) return;
      saveHistory();
      const delSet = new Set(state.selectedShapeIds);
      state.shapes = state.shapes.filter(s => !delSet.has(s.id));
      const nextActive = state.shapes.length > 0 ? state.shapes[state.shapes.length - 1].id : null;
      selectSingleShape(nextActive, 0);
      renderAll();
      triggerAutoSave();
    });

    document.getElementById('btnSaveTemplate').addEventListener('click', saveSelectedShapeAsTemplate);
    document.getElementById('inpTemplateName').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') saveSelectedShapeAsTemplate();
    });

    document.getElementById('btnSaveFullPalette').addEventListener('click', saveFullPaletteWithName);
    document.getElementById('inpPaletteSaveName').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') saveFullPaletteWithName();
    });

    document.getElementById('btnSelectFolder').addEventListener('click', selectAutoSaveFolder);
    document.getElementById('btnDownloadJson').addEventListener('click', downloadPaletteJson);

    document.getElementById('btnImportJson').addEventListener('click', () => {
      document.getElementById('fileImportInput').click();
    });

    document.getElementById('fileImportInput').addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          applyLoadedData(data);
          showToast('JSONデータを読み込みました');
        } catch (err) {
          showToast('JSONファイルの形式が正しくありません');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    });

    document.getElementById('chkShowMainLines').addEventListener('change', (e) => {
      state.showMainLines = e.target.checked;
      renderPreview();
    });

    document.getElementById('chkShowSubGrid').addEventListener('change', (e) => {
      state.showSubGrid = e.target.checked;
      renderPreview();
    });

    document.getElementById('btnUndo').addEventListener('click', undo);

    window.addEventListener('keydown', (e) => {
      if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
        e.preventDefault();
        undo();
      } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c') {
        e.preventDefault();
        copySelectedShape();
      } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v') {
        e.preventDefault();
        pasteClipboardShape();
      } else if (e.key === 'Delete' || e.key === 'Backspace') {
        if (state.selectedShapeIds.length > 0) {
          e.preventDefault();
          document.getElementById('btnDeleteShape').click();
        }
      }
    });

    document.getElementById('btnClearAll').addEventListener('click', () => {
      saveHistory();
      state.grid = Array.from({ length: state.gridRows }, () => Array(GRID_COLS).fill(null));
      state.shapes = [];
      selectSingleShape(null);
      renderAll();
      triggerAutoSave();
    });

    document.getElementById('btnExportPreview').addEventListener('click', () => {
      const dataUrl = previewCanvas.toDataURL('image/png');
      const link = document.createElement('a');
      link.download = 'perspective_preview.png';
      link.href = dataUrl;
      link.click();
    });

    function applyLoadedData(data) {
      if (!data) return;
      const rows = ALLOWED_ROW_DIVISIONS.includes(data.gridRows) ? data.gridRows : 16;
      state.gridRows = rows;
      if (typeof data.lastUsedWidth === 'number') {
        setLastUsedWidth(data.lastUsedWidth);
      }
      if (typeof data.slideOpacity === 'number') {
        state.slideOpacity = data.slideOpacity;
        const pct = Math.round(state.slideOpacity * 100);
        document.getElementById('rngSlideOpacity').value = pct;
        document.getElementById('lblSlideOpacity').textContent = `${pct}%`;
      }
      if (typeof data.guideOpacity === 'number') {
        state.guideOpacity = data.guideOpacity;
        const pct = Math.round(state.guideOpacity * 100);
        document.getElementById('rngGuideOpacity').value = pct;
        document.getElementById('lblGuideOpacity').textContent = `${pct}%`;
      }
      state.grid = Array.isArray(data.grid) && data.grid.length === rows
        ? data.grid
        : Array.from({ length: rows }, () => Array(GRID_COLS).fill(null));
      state.shapes = Array.isArray(data.shapes) ? data.shapes.map(s => normalizeShape(s, rows)) : [];
      if (Array.isArray(data.templates)) {
        state.templates = data.templates;
      }
      if (Array.isArray(data.savedPalettes)) {
        state.savedPalettes = data.savedPalettes;
      }
      const lastId = state.shapes.length > 0 ? state.shapes[state.shapes.length - 1].id : null;
      selectSingleShape(lastId, 0);
      updateGridDivisionUI();
      updateColorButtonsUI();
      renderTemplateList();
      renderSavedPaletteList();
      syncUIWithSelectedShape();
      renderAll();
    }

    function initApp() {
      try {
        const savedTpls = localStorage.getItem(STORAGE_KEY_TEMPLATES);
        if (savedTpls) {
          state.templates = JSON.parse(savedTpls);
        } else {
          state.templates = [
            {
              id: 'tpl_default_1',
              name: 'ガイド・カーブ（（',
              color: 'green',
              nodesRatio: [
                { left: 2, right: 6, yRatio: 0, curveMode: 'left' },
                { left: 5, right: 9, yRatio: 1.0, curveMode: 'straight' }
              ]
            },
            {
              id: 'tpl_default_2',
              name: 'スライド・中継S字',
              color: 'yellowgreen',
              nodesRatio: [
                { left: 2, right: 5, yRatio: 0, curveMode: 'right' },
                { left: 7, right: 10, yRatio: 0.5, curveMode: 'left' },
                { left: 3, right: 6, yRatio: 1.0, curveMode: 'straight' }
              ]
            }
          ];
        }
      } catch (e) {
        state.templates = [];
      }

      try {
        const savedPals = localStorage.getItem(STORAGE_KEY_SAVED_PALETTES);
        if (savedPals) {
          state.savedPalettes = JSON.parse(savedPals);
        } else {
          state.savedPalettes = [];
        }
      } catch (e) {
        state.savedPalettes = [];
      }

      let loaded = false;
      try {
        const savedPalette = localStorage.getItem(STORAGE_KEY_PALETTE);
        if (savedPalette) {
          applyLoadedData(JSON.parse(savedPalette));
          loaded = true;
        }
      } catch (e) {
        loaded = false;
      }

      if (!loaded) {
        const rows = state.gridRows;
        state.shapes = [
          normalizeShape({
            id: 'sample_orange',
            color: 'orange',
            nodes: [
              { left: 1, right: 5, y: 0, curveMode: 'left' },
              { left: 4, right: 8, y: Math.round(rows * 0.5), curveMode: 'right' },
              { left: 2, right: 5, y: Math.round(rows * 0.88), curveMode: 'straight' }
            ]
          }),
          normalizeShape({
            id: 'sample_green',
            color: 'green',
            nodes: [
              { left: 6, right: 11, y: 0, curveMode: 'right' },
              { left: 4, right: 8, y: rows, curveMode: 'straight' }
            ]
          })
        ];
        selectSingleShape('sample_green', 0);
        updateColorButtonsUI();
        updateGridDivisionUI();
        renderTemplateList();
        renderSavedPaletteList();
        syncUIWithSelectedShape();
        renderAll();
      }

      state.history = [];
      updateUndoButton();
    }

    window.onload = initApp;
  </script>
</body>
</html>
